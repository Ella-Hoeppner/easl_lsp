[package]
name = "easl_lsp"
version = "0.0.0"
edition = "2024"

[dependencies]
serde_json = "1.0.121"
fsexp = "0.1"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "io-std", "macros", "io-util", "time"] }
